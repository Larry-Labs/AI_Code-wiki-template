# ============================================================
# 00-manifest.yaml — 项目身份
# ============================================================
# AI 读到这个文件，第一秒就知道：这是什么项目、用了什么、从哪开始。
# 所有字段必须填写，不留"待定"。
# 参考 guides/00-manifest-guide.md 查看各项目类型的填写示例。

name: <项目名称>
description: "<一句话描述项目做什么（不超过 50 字）>"

# ------------------------------------------------------------
# 技术栈
# ------------------------------------------------------------
tech_stack:
  language: <主语言>           # typescript / python / c / rust / go / swift / kotlin
  runtime: <运行时>            # node@20 / python@3.12 / stm32 / esp32 / 无
  framework: <框架>            # express / next / fastapi / freertos / 无
  database: <数据库>           # postgresql@16 / redis@7 / flash / 无
  orm: <ORM/数据层>            # prisma / sqlalchemy / 直接操作寄存器 / 无
  style: <UI 方案>             # tailwindcss / qt / terminal / none

# ------------------------------------------------------------
# 依赖清单
# 关键依赖必须写明用途，AI 需要知道为什么用它
# ------------------------------------------------------------
dependencies:
  critical:
    - name: <依赖名>
      version: "<版本>"
      purpose: "<用途说明>"
  optional:
    - name: <依赖名>
      version: "<版本>"
      purpose: "<用途说明>"

# ------------------------------------------------------------
# 入口点
# AI 从这里开始读代码
# ------------------------------------------------------------
entry_points:
  main: <程序入口文件路径>
  config: <配置入口文件路径>
  api: <API 入口目录>           # Web 项目
  db: <数据库定义文件路径>       # 如有

# ------------------------------------------------------------
# 目录概览（一句话说明每个顶层目录）
# ------------------------------------------------------------
directories:
  <目录路径>: "<一句话说明>"

# ------------------------------------------------------------
# 项目元信息（可选）
# ------------------------------------------------------------
meta:
  author: ""
  license: <许可证>
  repo: ""
  created: ""
